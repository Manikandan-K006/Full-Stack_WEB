services:
  mongodb:
    image: mongo:8.0
    container_name: weblab-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: weblab-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      DATABASE_NAME: fullstack_web_lab
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_to_a_long_random_string}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost:8080,http://localhost:3000,http://localhost:8765
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: "120"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      SEED_ADMIN_EMAIL: admin@weblab.local
      SEED_ADMIN_PASSWORD: Admin@123
    ports:
      - "8765:8765"

  frontend:
    image: nginx:alpine
    container_name: weblab-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
    ports:
      - "3000:80"

volumes:
  mongo_data: